<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Guest Management</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --navy:#17365D;
  --green:#16834a;
  --red:#b42318;
  --dup-red-bright:#ef4444;
  --dup-red-bright-hover:#dc2626;
  --dup-box-bg:#fef2f2;
  --dup-box-bd:#f87171;
  --dup-box-fg:#7f1d1d;
  --bg:#f3f6fa;
  --souv-bg:#eff6ff;
  --souv-bd:#60a5fa;
  --souv-fg:#1e3a8a;
  --souv-pill-bg:#dbeafe;
  --school-bg:#fef3c7;
  --school-bd:#f59e0b;
  --school-fg:#92400e;
  --school-pill-bg:#fde68a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#172033;font-family:Arial,sans-serif}
header{background:var(--navy);color:white;padding:18px 16px}
header h1{font-size:19px;margin:0 0 5px}
header p{font-size:12px;margin:0;opacity:.85}
main{max-width:560px;margin:16px auto;padding:0 12px 28px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #13294b12}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 6px}
input[type="text"],input[type="number"],input:not([type]),select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
button{border:0;background:var(--navy);color:white;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:bold;width:100%;margin-top:12px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#e8eef6;color:var(--navy)}
button.btn-dup-edit{
  background:var(--dup-red-bright);
  color:#ffffff;
  border:2px solid #dc2626;
  box-shadow:0 3px 10px rgba(239,68,68,.35);
}
button.btn-dup-edit:hover{
  background:var(--dup-red-bright-hover);
}
#reader{width:100%;overflow:hidden;border-radius:12px;min-height:40px}
.hint{font-size:12px;color:#64748b;line-height:1.5}
#result{display:none;border-radius:12px;padding:16px;margin-top:12px}
#result.good{display:block;background:#e5f5eb;border:1px solid #9ad3ae;color:#14532d}
#result.bad{display:block;background:#fff0ed;border:1px solid #f2b4aa;color:#8a1c13}
#result.info{display:block;background:#eff6ff;border:1px solid #93c5fd;color:#1e3a8a}
#result.dup-red{display:block;background:#fef2f2;border:2px solid #f87171;color:#7f1d1d}
#result h2{margin:0 0 7px;font-size:18px}
#result p{margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.inv-badge{display:inline-block;background:var(--navy);color:#ffffff;font-size:16px;font-weight:bold;padding:6px 12px;border-radius:8px;margin:4px 0 8px;letter-spacing:.5px}
.mode{display:inline-block;border-radius:99px;background:#e8eef6;color:var(--navy);padding:6px 10px;font-size:12px;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.api{font-size:11px;color:#64748b;overflow-wrap:anywhere}
.actual-box{background:#fff;border:1px solid #9ad3ae;padding:12px;border-radius:8px;margin-top:10px}
.actual-box.dup-edit-box{background:#ffffff;border:2px solid #ef4444;color:#7f1d1d}
.actual-box.dup-edit-box label{color:#991b1b;font-size:12px;margin:6px 0 3px}
.actual-box.locked-box{border-color:#d97706;box-shadow:0 0 0 2px #fef3c7}
.actual-box label{font-size:11px;margin:4px 0 2px;color:#14532d}
.actual-box input[type="number"],.actual-box input[type="text"],.actual-box select{padding:8px;font-size:14px}
.lock-note{background:#fffbeb;border:1px solid #f59e0b;color:#92400e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:bold;margin-top:8px}
.check-row{display:flex;align-items:center;gap:10px;background:#f0fdf4;border:1px solid #86efac;padding:10px 12px;border-radius:8px;margin-top:10px;cursor:pointer}
.check-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--green);margin:0;cursor:pointer;flex-shrink:0}
.check-row span{font-size:14px;font-weight:bold;color:#14532d}
.summary-pill{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:13px;color:#1e293b;margin-top:8px}

/* Kotak informasi warna merah saat double scan check-in */
.dup-info-banner{
  background:var(--dup-box-bg);
  border:2px solid var(--dup-box-bd);
  border-radius:10px;
  padding:12px;
  margin-top:8px;
  color:var(--dup-box-fg);
}
.dup-info-title{
  font-size:14px;
  font-weight:bold;
  color:#dc2626;
  margin-bottom:6px;
}
.dup-meta{
  font-size:13px;
  margin:4px 0;
  color:#7f1d1d;
}

/* Highlight detail tamu saat check-in */
.checkin-highlight-card{
  background:#ffffff;
  border:2px solid #16a34a;
  border-radius:10px;
  padding:12px;
  margin-top:8px;
  box-shadow:0 2px 6px rgba(22,163,74,.12);
}
.highlight-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:6px;
}
.hl-item{
  background:#f0fdf4;
  border:1px solid #86efac;
  border-radius:8px;
  padding:8px 10px;
}
.hl-item.full-span{grid-column:1 / -1}
.hl-item.id-sub{
  background:#f8fafc;
  border-color:#cbd5e1;
}
.hl-item.table-hl{
  background:#fef9c3;
  border-color:#eab308;
}
.hl-label{
  display:block;
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.3px;
  color:#15803d;
  margin-bottom:2px;
}
.hl-item.id-sub .hl-label{color:#334155}
.hl-item.table-hl .hl-label{color:#854d0e}
.hl-val{
  font-size:15px;
  font-weight:bold;
  color:#0f172a;
  overflow-wrap:anywhere;
}
.hl-item.id-sub .hl-val{
  font-size:13px;
  font-family:monospace;
  color:#1e293b;
}
.hl-item.table-hl .hl-val{
  font-size:17px;
  color:#713f12;
}

/* Grid bawah Nomor Meja: 3 grid (Dewasa, Anak, Suster) + 2 grid (Souvenir, Souvenir Teman Sekolah) */
.undangan-highlight{
  background:#ecfdf5;
  border:1.5px solid #16a34a;
  border-radius:8px;
  padding:10px 12px;
  margin-top:8px;
  color:#14532d;
}
.undangan-highlight .uh-title{
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  color:#15803d;
  margin-bottom:8px;
}
.guest-3-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
}
.souv-2-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  margin-top:8px;
}
.gbox-item{
  background:#dcfce7;
  border:1px solid #86efac;
  border-radius:8px;
  padding:8px;
  text-align:center;
  color:#14532d;
}
.gbox-lbl{
  display:block;
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
}
.gbox-val{
  display:block;
  font-size:16px;
  font-weight:bold;
  margin-top:2px;
}
.sbox-reg{
  background:var(--souv-bg);
  border:1.5px solid var(--souv-bd);
  border-radius:8px;
  padding:8px 10px;
  text-align:center;
  color:var(--souv-fg);
}
.sbox-reg .gbox-lbl{color:var(--souv-fg)}
.sbox-reg .gbox-val{color:#1e3a8a}

.sbox-sch{
  background:var(--school-bg);
  border:1.5px solid var(--school-bd);
  border-radius:8px;
  padding:8px 10px;
  text-align:center;
  color:var(--school-fg);
}
.sbox-sch .gbox-lbl{color:var(--school-fg)}
.sbox-sch .gbox-val{color:#78350f}

/* Warna pembeda Souvenir vs Souvenir Teman Sekolah */
.souvenir-split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
.souv-card-regular{
  background:var(--souv-bg);
  border:2px solid var(--souv-bd);
  border-radius:10px;
  padding:10px;
  color:var(--souv-fg);
}
.souv-card-regular .souv-tag{
  display:inline-block;
  background:var(--souv-pill-bg);
  border:1px solid var(--souv-bd);
  color:var(--souv-fg);
  font-size:11px;
  font-weight:bold;
  padding:2px 7px;
  border-radius:99px;
  margin-bottom:4px;
}
.souv-card-regular .souv-qty{
  font-size:18px;
  font-weight:bold;
  color:#1e3a8a;
}

.souv-card-school{
  background:var(--school-bg);
  border:2px solid var(--school-bd);
  border-radius:10px;
  padding:10px;
  color:var(--school-fg);
}
.souv-card-school .souv-tag{
  display:inline-block;
  background:var(--school-pill-bg);
  border:1px solid var(--school-bd);
  color:var(--school-fg);
  font-size:11px;
  font-weight:bold;
  padding:2px 7px;
  border-radius:99px;
  margin-bottom:4px;
}
.souv-card-school .souv-qty{
  font-size:18px;
  font-weight:bold;
  color:#78350f;
}

.field-lbl-souv{color:var(--souv-fg) !important}
.field-lbl-school{color:var(--school-fg) !important}
.input-souv{border-color:var(--souv-bd) !important;background:var(--souv-bg) !important;color:var(--souv-fg) !important;font-weight:bold}
.input-school{border-color:var(--school-bd) !important;background:var(--school-bg) !important;color:var(--school-fg) !important;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>Grace and Irene</h1>
<p>Birthday Louis • Marqen Hotel 28 November 2026</p>
</header>
<main>
<section class="card">
<span class="mode" id="modeLabel">CHECK-IN TAMU</span>
<label>Mode transaksi</label>
<select id="mode" onchange="changeMode()">
<option value="checkin">Check-in tamu</option>
<option value="souvenir">Penukaran souvenir</option>
</select>
<label>Nama petugas</label>
<input id="operator" placeholder="Contoh: Resepsionis 1" autocomplete="name">
</section>

<section class="card">
<label>Kamera</label>
<select id="cameraSelect">
<option value="">Kamera utama / belakang</option>
</select>
<div id="reader"></div>
<p class="hint" id="cameraHint">Izinkan akses kamera. Gunakan Chrome dan tautan HTTPS.</p>
<div class="row">
<button onclick="startScanner()">Mulai kamera</button>
<button class="secondary" onclick="stopScanner()">Hentikan</button>
</div>
<label>Input kode secara manual (opsional)</label>
<input id="manualCode" placeholder="Tempel / ketik ID QR" onkeydown="if(event.key==='Enter'){event.preventDefault();manualSubmit();}">
<button class="secondary" onclick="manualSubmit()">Proses kode manual</button>
</section>

<section id="result"></section>

<section class="card">
<p class="hint">Grace and Irene 2026.</p>
<p class="api">API: <span id="apiStatus">Menghubungkan…</span></p>
</section>
</main>

<iframe id="apiBridgeFrame" src="about:blank" style="display:none;width:0;height:0;border:0;"></iframe>

<script>
// Ganti dengan URL Web App deployment Google Apps Script Anda (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyo0iCqvaG5-sSa_SuF_tRdKVK1M4WlZujG-VNs9uizXnDuYw9DqsZzGzScQTI74nVt2A/exec';

let scanner = null;
let busy = false;
let pendingConfirmRequired = false;
let pendingSavePayload = null;
let lastScanAt = 0;
let cameras = [];
let bridgeReady = false;
const pendingBridgeCalls = new Map();
const params = new URLSearchParams(location.search);

function toNonNegNumber(val, fallback = 0){
 const n = parseInt(String(val ?? '').replace(/[^\d-]/g, ''), 10);
 if(isNaN(n) || n < 0) return fallback;
 return n;
}

function bindNumberSanitizers(){
 document.querySelectorAll('input[type="number"]').forEach(inp => {
  if(inp.dataset.sanitized) return;
  inp.dataset.sanitized = '1';
  inp.addEventListener('input', () => {
   if(inp.value === '') return;
   const n = parseInt(inp.value, 10);
   if(isNaN(n) || n < 0) inp.value = 0;
  });
  inp.addEventListener('blur', () => {
   inp.value = toNonNegNumber(inp.value, 0);
  });
 });
}

function isValidApiUrl(url){
 return /^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec(?:\?.*)?$/.test(String(url || '').trim());
}

function getBaseExecUrl(){
 return String(API_URL || '').trim().split('?')[0];
}

function initApiBridge(){
 const frame = document.getElementById('apiBridgeFrame');
 if(!frame || !isValidApiUrl(API_URL)) return;
 const sep = getBaseExecUrl().indexOf('?') >= 0 ? '&' : '?';
 frame.src = getBaseExecUrl() + sep + 'mode=bridge&_=' + Date.now();
}

window.addEventListener('message', function(ev){
 const msg = ev && ev.data ? ev.data : {};
 if(msg.type === 'GNI_BRIDGE_READY'){
  bridgeReady = true;
  return;
 }
 if(msg.type === 'GNI_API_RES' && msg.reqId && pendingBridgeCalls.has(msg.reqId)){
  const cb = pendingBridgeCalls.get(msg.reqId);
  pendingBridgeCalls.delete(msg.reqId);
  clearTimeout(cb.timer);
  if(msg.ok){
   cb.resolve(msg.data);
  } else {
   cb.reject(new Error(msg.error || 'Bridge error'));
  }
 }
});

function callViaBridge(payload){
 return new Promise((resolve, reject) => {
  const frame = document.getElementById('apiBridgeFrame');
  if(!frame || !frame.contentWindow){
   reject(new Error('Bridge iframe tidak tersedia'));
   return;
  }
  const reqId = 'req_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  const timer = setTimeout(() => {
   pendingBridgeCalls.delete(reqId);
   reject(new Error('Bridge timeout'));
  }, 20000);

  pendingBridgeCalls.set(reqId, { resolve, reject, timer });
  frame.contentWindow.postMessage({ type: 'GNI_API_REQ', reqId, payload }, '*');
 });
}

function currentMode(){
 return document.getElementById('mode').value;
}

function changeMode(){
 if(pendingConfirmRequired){
  document.getElementById('mode').value = 'checkin';
  showResult(
   'bad',
   'Wajib Simpan Konfirmasi Kehadiran',
   '<p>Tekan tombol <b>"Simpan Konfirmasi Kehadiran"</b> terlebih dahulu sebelum mengganti mode atau memindai tamu berikutnya.</p>'
  );
  return;
 }
 document.getElementById('modeLabel').textContent =
  currentMode() === 'souvenir' ? 'PENUKARAN SOUVENIR' : 'CHECK-IN TAMU';
 showResult('', '', '');
}

function esc(s){
 return String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
 }[c]));
}

function showResult(kind, title, detail){
 const b = document.getElementById('result');
 if(!kind){
  b.style.display = 'none';
  b.className = '';
  b.innerHTML = '';
  return;
 }
 b.style.display = 'block';
 b.className = kind;
 b.innerHTML = '<h2>' + esc(title) + '</h2>' + detail;
 bindNumberSanitizers();
 b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function pauseScannerSafe(){
 try{
  if(scanner && typeof scanner.getState === 'function'){
   if(scanner.getState() === 2){
    scanner.pause(true);
   }
  } else if(scanner && scanner.isScanning){
   scanner.pause(true);
  }
 }catch(e){}
}

function resumeScannerSafe(){
 try{
  if(scanner && typeof scanner.getState === 'function'){
   if(scanner.getState() === 3){
    scanner.resume();
    return;
   }
   if(scanner.getState() === 2){
    return;
   }
  }
  if(scanner && scanner.isScanning){
   scanner.resume();
  } else {
   startScanner();
  }
 }catch(e){
  startScanner();
 }
}

function parseApiTextResponse_(txt){
 const clean = String(txt || '').trim();
 const jsonpMatch = clean.match(/^[A-Za-z_$][0-9A-Za-z_$\.]*\((.*)\);?$/s);
 return JSON.parse(jsonpMatch ? jsonpMatch[1] : clean);
}

function runJsonpFallback(payload, resolve, reject, lastErr){
 const callback = 'gasCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
 const script = document.createElement('script');
 script.async = true;
 let finished = false;

 const timer = setTimeout(() => {
  finish(new Error('Timeout (' + (lastErr || 'JSONP') + ')'));
 }, 28000);

 function finish(err, data){
  if(finished) return;
  finished = true;
  clearTimeout(timer);
  try{ delete window[callback]; }catch(e){ window[callback] = undefined; }
  if(script.parentNode) script.remove();
  err ? reject(err) : resolve(data);
 }

 window[callback] = data => finish(null, data);

 const query = new URLSearchParams({
  ...payload,
  callback,
  _: Date.now().toString()
 });

 script.onerror = () => {
  finish(new Error('Gagal memuat skrip (cek ad-blocker/DNS/jaringan HP).'));
 };

 script.src = getBaseExecUrl() + '?' + query.toString();
 document.head.appendChild(script);
}

function callAppsScript(payload){
 return new Promise((resolve, reject) => {
  if(!isValidApiUrl(API_URL)){
   reject(new Error('API_URL belum diatur ke URL Web App Google Apps Script (/exec) yang valid.'));
   return;
  }

  const tryDirectOrJsonp = (prevErr) => {
   const query = new URLSearchParams({
    ...payload,
    _: Date.now().toString()
   });
   const targetUrl = getBaseExecUrl() + '?' + query.toString();

   if(typeof fetch === 'function'){
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const fetchTimer = setTimeout(() => {
     if(controller) controller.abort();
    }, 18000);

    fetch(targetUrl, {
     method: 'GET',
     redirect: 'follow',
     cache: 'no-store',
     signal: controller ? controller.signal : undefined
    })
    .then(r => {
     clearTimeout(fetchTimer);
     if(!r.ok) throw new Error('HTTP ' + r.status);
     return r.text();
    })
    .then(txt => {
     resolve(parseApiTextResponse_(txt));
    })
    .catch(err => {
     clearTimeout(fetchTimer);
     runJsonpFallback(payload, resolve, reject, prevErr || (err && err.message ? err.message : 'Fetch gagal'));
    });
    return;
   }

   runJsonpFallback(payload, resolve, reject, prevErr || 'Fetch tidak tersedia');
  };

  if(bridgeReady){
   callViaBridge(payload)
    .then(resolve)
    .catch(err => tryDirectOrJsonp(err && err.message ? err.message : 'Bridge gagal'));
   return;
  }

  tryDirectOrJsonp('');
 });
}

function normalizeQrCode(value){
 let code = String(value ?? '').normalize('NFKC')
  .replace(/[\u200B-\u200D\uFEFF]/g, '')
  .replace(/[\u0000-\u001F\u007F]/g, '')
  .trim();

 if(/^https?:\/\//i.test(code)){
  try{
   const u = new URL(code);
   const fromUrl = u.searchParams.get('code') || u.searchParams.get('id') || u.searchParams.get('qr');
   if(fromUrl) code = fromUrl.trim();
  }catch(e){}
 }
 return code;
}

function getGuestTableNo(g){
 if(!g || typeof g !== 'object') return '';
 const raw = g.tableNo ?? g.nomorMeja ?? g.nomor_meja ?? g.table ?? g.meja ?? '';
 return String(raw ?? '').trim();
}

function getGuestIdQr(g, fallbackCode = ''){
 if(!g || typeof g !== 'object') return String(fallbackCode || '').trim();
 const raw = g.id ?? g.id_qr ?? g.ID_QR ?? g.code ?? fallbackCode ?? '';
 return String(raw ?? '').trim();
}

function toggleCheckinForm(){
 const chk = document.getElementById('chkSesuai');
 const form = document.getElementById('checkinActualForm');
 if(!chk || !form) return;
 form.style.display = chk.checked ? 'none' : 'block';
}

function toggleSouvenirForm(){
 const chk = document.getElementById('chkSouvSesuai');
 const form = document.getElementById('souvActualForm');
 if(!chk || !form) return;
 form.style.display = chk.checked ? 'none' : 'block';
}

function toggleDuplicateEditForm(){
 const form = document.getElementById('dupEditForm');
 const btn = document.getElementById('btnToggleDupEdit');
 if(!form) return;
 const isHidden = form.style.display === 'none' || !form.style.display;
 form.style.display = isHidden ? 'block' : 'none';
 if(btn){
  btn.textContent = isHidden ? 'Tutup Form Ubah Data Kehadiran' : 'Ingin merubah data kehadiran ?';
 }
}

function renderCheckinFormMarkup(code, g, idQrDisplay, tableDisplay, adultsVal, childrenVal, nanniesVal, souvVal, souvSchoolVal, preset = null){
 const angpaoInit = preset ? toNonNegNumber(preset.angpao, 0) : 0;
 const hadiahInit = preset ? toNonNegNumber(preset.hadiah, 0) : 0;
 const catatanInit = preset ? String(preset.catatanGift || '') : '';
 const isNotSesuai = preset && preset.adults !== undefined;
 const actAdultsInit = preset && preset.adults !== undefined ? toNonNegNumber(preset.adults, adultsVal) : adultsVal;
 const actChildrenInit = preset && preset.children !== undefined ? toNonNegNumber(preset.children, childrenVal) : childrenVal;
 const actNanniesInit = preset && preset.nannies !== undefined ? toNonNegNumber(preset.nannies, nanniesVal) : nanniesVal;

 return `
  <div class="checkin-highlight-card">
    <div class="highlight-grid">
      <div class="hl-item full-span">
        <span class="hl-label">Nama Tamu</span>
        <div class="hl-val">${esc(g.name)}</div>
      </div>
      <div class="hl-item id-sub full-span">
        <span class="hl-label">ID_QR</span>
        <div class="hl-val">${esc(idQrDisplay)}</div>
      </div>
      <div class="hl-item">
        <span class="hl-label">No. Telepon</span>
        <div class="hl-val">${esc(g.phone || '-')}</div>
      </div>
      <div class="hl-item">
        <span class="hl-label">Kategori</span>
        <div class="hl-val">${esc(g.category || '-')}</div>
      </div>
      <div class="hl-item table-hl full-span">
        <span class="hl-label">Nomor Meja</span>
        <div class="hl-val">${esc(tableDisplay)}</div>
      </div>
    </div>

    <div class="undangan-highlight">
      <div class="uh-title">Rincian Tamu &amp; Souvenir</div>
      <div class="guest-3-grid">
        <div class="gbox-item">
          <span class="gbox-lbl">Dewasa</span>
          <span class="gbox-val">${esc(adultsVal)}</span>
        </div>
        <div class="gbox-item">
          <span class="gbox-lbl">Anak</span>
          <span class="gbox-val">${esc(childrenVal)}</span>
        </div>
        <div class="gbox-item">
          <span class="gbox-lbl">Suster</span>
          <span class="gbox-val">${esc(nanniesVal)}</span>
        </div>
      </div>
      <div class="souv-2-grid">
        <div class="sbox-reg">
          <span class="gbox-lbl">Souvenir</span>
          <span class="gbox-val">${esc(souvVal)}</span>
        </div>
        <div class="sbox-sch">
          <span class="gbox-lbl">Souvenir Teman Sekolah</span>
          <span class="gbox-val">${esc(souvSchoolVal)}</span>
        </div>
      </div>
    </div>
  </div>

  <label class="check-row" for="chkSesuai">
    <input type="checkbox" id="chkSesuai" ${isNotSesuai ? '' : 'checked'} onchange="toggleCheckinForm()">
    <span>Data kehadiran sesuai undangan (Dicatat saat Simpan Konfirmasi Kehadiran)</span>
  </label>
  <div id="checkinActualForm" class="actual-box" style="display:${isNotSesuai ? 'block' : 'none'};">
    <b>Input Jumlah Kehadiran Aktual (Tidak Sesuai):</b>
    <div class="guest-3-grid" style="margin-top:8px;">
      <div><label>Dewasa</label><input type="number" id="actAdults" min="0" step="1" value="${esc(actAdultsInit)}"></div>
      <div><label>Anak</label><input type="number" id="actChildren" min="0" step="1" value="${esc(actChildrenInit)}"></div>
      <div><label>Suster</label><input type="number" id="actNannies" min="0" step="1" value="${esc(actNanniesInit)}"></div>
    </div>
  </div>
  <div class="actual-box locked-box" style="margin-top:10px;">
    <b>Angpao &amp; Hadiah:</b>
    <div class="row">
      <div><label>Angpao</label><input type="number" id="giftAngpao" min="0" step="1" value="${esc(angpaoInit)}"></div>
      <div><label>Hadiah</label><input type="number" id="giftHadiah" min="0" step="1" value="${esc(hadiahInit)}"></div>
    </div>
    <div style="margin-top:8px;">
      <label for="giftCatatan">Catatan Angpao &amp; Hadiah</label>
      <input type="text" id="giftCatatan" value="${esc(catatanInit)}" placeholder="Contoh: Angpao amplop merah / Kado mainan balok" autocomplete="off">
    </div>
    <button id="btnSaveCheckinConfirm" onclick="saveCheckin('${esc(code)}')" style="background:var(--green); margin-top:12px;">Simpan Konfirmasi Kehadiran</button>
    <div class="lock-note">Waktu check-in, petugas, kehadiran, angpao, hadiah &amp; catatan dicatat saat "Simpan Konfirmasi Kehadiran" ditekan.</div>
  </div>
 `;
}

function processCode(rawCode, overrideData = null){
 const code = normalizeQrCode(rawCode);
 if(busy) return;

 if(pendingConfirmRequired && !(overrideData && overrideData.isUpdate)){
  pauseScannerSafe();
  showResult(
   'bad',
   'Wajib Simpan Konfirmasi Kehadiran',
   '<p>Silakan tekan tombol <b>"Simpan Konfirmasi Kehadiran"</b> terlebih dahulu sebelum memindai tamu berikutnya.</p>'
  );
  return;
 }

 if(!code){
  showResult('bad', 'Kode QR kosong', '<p>QR terbaca, tetapi tidak berisi kode.</p>');
  return;
 }

 const operator = document.getElementById('operator').value.trim();
 if(!operator){
  pauseScannerSafe();
  showResult(
   'bad',
   'Isi nama resepsionis',
   '<p>Masukkan nama resepsionis terlebih dahulu, lalu klik tombol di bawah untuk melanjutkan scan.</p>' +
   '<button onclick="resumeScanner()" style="background:var(--navy); margin-top:12px;">Lanjutkan Scan</button>'
  );
  return;
 }

 const isUpdate = Boolean(overrideData && overrideData.isUpdate);
 const modeNow = currentMode();

 busy = true;
 pauseScannerSafe();
 showResult(
  'info',
  isUpdate ? 'Menyimpan Konfirmasi…' : 'Memproses QR…',
  '<p>Kode: <b>' + esc(code) + '</b> sedang dikirim ke server.</p>'
 );

 const payload = {
  action: 'scan',
  code,
  mode: modeNow,
  operator,
  userAgent: navigator.userAgent,
  isUpdate: isUpdate ? 'true' : 'false'
 };

 if(overrideData){
  if(overrideData.adults !== undefined) payload.adults = String(toNonNegNumber(overrideData.adults, 0));
  if(overrideData.children !== undefined) payload.children = String(toNonNegNumber(overrideData.children, 0));
  if(overrideData.nannies !== undefined) payload.nannies = String(toNonNegNumber(overrideData.nannies, 0));
  if(overrideData.qtySouvenir !== undefined) payload.qtySouvenir = String(toNonNegNumber(overrideData.qtySouvenir, 0));
  if(overrideData.qtySouvenirSchool !== undefined) payload.qtySouvenirSchool = String(toNonNegNumber(overrideData.qtySouvenirSchool, 0));
  if(overrideData.penukar !== undefined) payload.penukar = overrideData.penukar;
  if(overrideData.angpao !== undefined && modeNow === 'checkin') payload.angpao = String(toNonNegNumber(overrideData.angpao, 0));
  if(overrideData.hadiah !== undefined && modeNow === 'checkin') payload.hadiah = String(toNonNegNumber(overrideData.hadiah, 0));
  if(overrideData.catatanGift !== undefined && modeNow === 'checkin') payload.catatanGift = String(overrideData.catatanGift || '');
  if(overrideData.isDuplicateEdit) payload.isDuplicateEdit = 'true';
 }

 if(isUpdate){
  pendingSavePayload = { code, overrideData };
 }

 callAppsScript(payload).then(res => {
  const g = res.guest || {};
  let d = '';

  const statusText = String(res.status || '').trim();
  const msgText = String(res.message || '').trim();
  const combinedStatus = (statusText + ' ' + msgText + ' ' + String(g.checkinStatus || '')).toLowerCase();

  const isAlreadyCheckedIn = Boolean(
   modeNow === 'checkin' &&
   !isUpdate &&
   (
    /sudah\s*check-?in/i.test(statusText + ' ' + msgText) ||
    (!res.ok && (Boolean(g.checkinTime) || combinedStatus.includes('sudah check-in') || combinedStatus.includes('sudah checkin')))
   )
  );

  const effectiveOk = isAlreadyCheckedIn ? false : Boolean(res.ok);
  const idQrDisplay = getGuestIdQr(g, code);

  // Pada scan awal mode check-in yang belum check-in (!isUpdate), form ditampilkan
  // dan user wajib menekan "Simpan Konfirmasi Kehadiran" untuk menulis data check-in.
  const isInitialCheckinForm = Boolean(g.name && modeNow === 'checkin' && effectiveOk && !isUpdate);
  if(isInitialCheckinForm){
   pendingConfirmRequired = true;
  } else if(isUpdate && effectiveOk){
   pendingConfirmRequired = false;
   pendingSavePayload = null;
  } else if(isAlreadyCheckedIn){
   pendingConfirmRequired = false;
   pendingSavePayload = null;
  }

  if(g.invitationNumber){
   d += '<div class="inv-badge">Nomor Undangan: ' + esc(g.invitationNumber) + '</div>';
  }

  const adultsVal = toNonNegNumber(g.adults, 0);
  const childrenVal = toNonNegNumber(g.children, 0);
  const nanniesVal = toNonNegNumber(g.nannies, 0);
  const souvVal = toNonNegNumber(g.qtySouvenir, 0);
  const souvSchoolVal = toNonNegNumber(g.qtySouvenirSchool, 0);
  const angpaoVal = toNonNegNumber(g.angpao, 0);
  const hadiahVal = toNonNegNumber(g.hadiah, 0);
  const catatanGiftVal = String(g.catatanGift ?? '').trim();
  const rawTable = getGuestTableNo(g);
  const tableDisplay = rawTable !== '' ? rawTable : '-';

  if(isAlreadyCheckedIn){
   d += `
    <div class="dup-info-banner">
      <div class="dup-info-title">Tamu Sudah Check-In Sebelumnya</div>
      <div class="dup-meta"><b>ID_QR:</b> ${esc(idQrDisplay)}</div>
      ${g.name ? `<div class="dup-meta"><b>Nama:</b> ${esc(g.name)}</div>` : ''}
      ${g.category ? `<div class="dup-meta"><b>Kategori:</b> ${esc(g.category)}</div>` : ''}
      <div class="dup-meta"><b>Nomor Meja:</b> ${esc(tableDisplay)}</div>
      ${g.checkinTime ? `<div class="dup-meta"><b>Waktu Check-in Awal:</b> ${esc(String(g.checkinTime))}</div>` : ''}
      ${g.checkinOperator ? `<div class="dup-meta"><b>Petugas Check-in Awal:</b> ${esc(String(g.checkinOperator))}</div>` : ''}
      <div class="dup-meta" style="margin-top:6px;">
        <b>Data Guest_Checkin Saat Ini:</b> Dewasa: ${esc(adultsVal)}, Anak: ${esc(childrenVal)}, Suster: ${esc(nanniesVal)} | Angpao: ${esc(angpaoVal)}, Hadiah: ${esc(hadiahVal)}${catatanGiftVal ? ` | Catatan: ${esc(catatanGiftVal)}` : ''}
      </div>
    </div>

    <button type="button" id="btnToggleDupEdit" class="btn-dup-edit" onclick="toggleDuplicateEditForm()" style="margin-top:12px;">Ingin merubah data kehadiran ?</button>

    <div id="dupEditForm" class="actual-box dup-edit-box" style="display:none; margin-top:10px;">
      <b>Ubah Data Guest_Checkin:</b>
      <div class="guest-3-grid" style="margin-top:8px;">
        <div><label>Dewasa</label><input type="number" id="dupAdults" min="0" step="1" value="${esc(adultsVal)}"></div>
        <div><label>Anak</label><input type="number" id="dupChildren" min="0" step="1" value="${esc(childrenVal)}"></div>
        <div><label>Suster</label><input type="number" id="dupNannies" min="0" step="1" value="${esc(nanniesVal)}"></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div><label>Angpao</label><input type="number" id="dupAngpao" min="0" step="1" value="${esc(angpaoVal)}"></div>
        <div><label>Hadiah</label><input type="number" id="dupHadiah" min="0" step="1" value="${esc(hadiahVal)}"></div>
      </div>
      <div style="margin-top:8px;">
        <label for="dupCatatan">Catatan Angpao &amp; Hadiah</label>
        <input type="text" id="dupCatatan" value="${esc(catatanGiftVal)}" placeholder="Catatan Angpao & Hadiah" autocomplete="off">
      </div>
      <button type="button" id="btnSaveDupEdit" onclick="saveDuplicateCheckinEdit('${esc(code)}')" style="background:var(--green); margin-top:12px;">Simpan Perubahan Data Kehadiran</button>
    </div>
   `;
  } else if(isInitialCheckinForm){
   d += renderCheckinFormMarkup(code, g, idQrDisplay, tableDisplay, adultsVal, childrenVal, nanniesVal, souvVal, souvSchoolVal, null);
  } else {
   if(g.name) d += '<p><b>Nama tamu:</b> ' + esc(g.name) + '</p>';
   if(idQrDisplay) d += '<p><b>ID_QR:</b> ' + esc(idQrDisplay) + '</p>';
   if(g.phone) d += '<p><b>No. telepon:</b> ' + esc(g.phone) + '</p>';
   if(g.category) d += '<p><b>Kategori:</b> ' + esc(g.category) + '</p>';
   if(g.name) d += '<p><b>Nomor meja:</b> ' + esc(tableDisplay) + '</p>';
  }

  if(g.name && modeNow === 'souvenir' && effectiveOk){
   d += `
    <div class="summary-pill">
      <b>Penukaran Souvenir</b> a.n. <b>${esc(g.name)}</b>${g.invitationNumber ? ' • No. Undangan: ' + esc(g.invitationNumber) : ''} • No. Meja: <b>${esc(tableDisplay)}</b>
    </div>
    <div class="souvenir-split">
      <div class="souv-card-regular">
        <span class="souv-tag">Souvenir</span>
        <div class="souv-qty">${esc(souvVal)} pcs</div>
      </div>
      <div class="souv-card-school">
        <span class="souv-tag">Souvenir Teman Sekolah</span>
        <div class="souv-qty">${esc(souvSchoolVal)} pcs</div>
      </div>
    </div>
   `;

   if(!isUpdate){
    d += `
     <label class="check-row" for="chkSouvSesuai">
       <input type="checkbox" id="chkSouvSesuai" checked onchange="toggleSouvenirForm()">
       <span>Pengambilan souvenir sesuai</span>
     </label>
     <div id="souvActualForm" class="actual-box" style="display:none;">
       <b>Input Detail Penukaran Aktual (Tidak Sesuai / Diwakilkan):</b>
       <label>Nama Penukar</label>
       <input type="text" id="actPenukar" value="${esc(g.name)}" placeholder="Nama pengambil">
       <div class="row">
         <div><label class="field-lbl-souv">Qty Souvenir</label><input type="number" class="input-souv" id="actSouvQty" min="0" step="1" value="${esc(souvVal)}"></div>
         <div><label class="field-lbl-school">Qty Souvenir Teman Sekolah</label><input type="number" class="input-school" id="actSouvSchoolQty" min="0" step="1" value="${esc(souvSchoolVal)}"></div>
       </div>
       <button onclick="saveSouvenir('${esc(code)}')" style="background:var(--green); margin-top:10px; padding:10px;">Simpan Konfirmasi Penukaran</button>
     </div>
    `;
   }
  }

  d += '<p><b>Waktu server:</b> ' + esc(res.timestamp || '') + '</p>';
  const displayMsg = isAlreadyCheckedIn
   ? (msgText || statusText || 'Sudah check-in sebelumnya')
   : msgText;
  if(displayMsg) d += '<p>' + esc(displayMsg) + '</p>';

  if(!pendingConfirmRequired){
   const nextBtnColor = isAlreadyCheckedIn ? 'var(--navy)' : 'var(--green)';
   d += '<button id="btnNextGuest" onclick="resumeScanner()" style="background:' + nextBtnColor + '; margin-top:14px;">🔄 Scan Tamu Berikutnya</button>';
  }

  const headingTitle = effectiveOk
   ? (isInitialCheckinForm ? 'DATA TAMU DITEMUKAN' : 'BERHASIL')
   : (isAlreadyCheckedIn ? 'SUDAH CHECK-IN' : (statusText || 'GAGAL'));

  const resultKind = effectiveOk ? 'good' : (isAlreadyCheckedIn ? 'dup-red' : 'bad');
  showResult(resultKind, headingTitle, d || '<p>Respons server kosong.</p>');
  document.getElementById('manualCode').value = '';
  busy = pendingConfirmRequired;
  lastScanAt = Date.now();
 }).catch(err => {
  const errMsg = '<p>' + esc(err.message || err) + '</p>';
  if(pendingSavePayload && pendingSavePayload.overrideData && pendingSavePayload.overrideData.isUpdate){
   showResult(
    'bad',
    'Gagal Menyimpan (Cek Koneksi)',
    errMsg +
    '<p>Data isian Anda aman. Tekan tombol di bawah untuk mencoba menyimpan kembali tanpa scan ulang.</p>' +
    '<button onclick="retryPendingSave()" style="background:var(--green); margin-top:12px;">Coba Simpan Ulang</button>'
   );
  } else {
   showResult(
    'bad',
    'Gagal menghubungi server',
    errMsg + '<button onclick="resumeScanner()" style="background:var(--red); margin-top:14px;">Coba Lagi</button>'
   );
  }
  busy = false;
  lastScanAt = Date.now();
 });
}

function retryPendingSave(){
 if(!pendingSavePayload) return;
 const { code, overrideData } = pendingSavePayload;
 busy = false;
 processCode(code, overrideData);
}

function saveCheckin(code){
 const btn = document.getElementById('btnSaveCheckinConfirm');
 if(btn) btn.disabled = true;
 const chk = document.getElementById('chkSesuai');
 const isSesuai = chk ? chk.checked : true;
 const adults = isSesuai ? undefined : (document.getElementById('actAdults') ? toNonNegNumber(document.getElementById('actAdults').value, 0) : undefined);
 const children = isSesuai ? undefined : (document.getElementById('actChildren') ? toNonNegNumber(document.getElementById('actChildren').value, 0) : undefined);
 const nannies = isSesuai ? undefined : (document.getElementById('actNannies') ? toNonNegNumber(document.getElementById('actNannies').value, 0) : undefined);
 const angpao = document.getElementById('giftAngpao') ? toNonNegNumber(document.getElementById('giftAngpao').value, 0) : 0;
 const hadiah = document.getElementById('giftHadiah') ? toNonNegNumber(document.getElementById('giftHadiah').value, 0) : 0;
 const catatanGift = document.getElementById('giftCatatan') ? document.getElementById('giftCatatan').value.trim() : '';
 busy = false;
 processCode(code, { adults, children, nannies, angpao, hadiah, catatanGift, isUpdate: true });
}

function saveDuplicateCheckinEdit(code){
 const btn = document.getElementById('btnSaveDupEdit');
 if(btn) btn.disabled = true;
 const adults = document.getElementById('dupAdults') ? toNonNegNumber(document.getElementById('dupAdults').value, 0) : 0;
 const children = document.getElementById('dupChildren') ? toNonNegNumber(document.getElementById('dupChildren').value, 0) : 0;
 const nannies = document.getElementById('dupNannies') ? toNonNegNumber(document.getElementById('dupNannies').value, 0) : 0;
 const angpao = document.getElementById('dupAngpao') ? toNonNegNumber(document.getElementById('dupAngpao').value, 0) : 0;
 const hadiah = document.getElementById('dupHadiah') ? toNonNegNumber(document.getElementById('dupHadiah').value, 0) : 0;
 const catatanGift = document.getElementById('dupCatatan') ? document.getElementById('dupCatatan').value.trim() : '';
 busy = false;
 processCode(code, {
  adults,
  children,
  nannies,
  angpao,
  hadiah,
  catatanGift,
  isUpdate: true,
  isDuplicateEdit: true
 });
}

function saveSouvenir(code){
 const penukar = document.getElementById('actPenukar').value;
 const qtySouvenir = toNonNegNumber(document.getElementById('actSouvQty').value, 0);
 const qtySouvenirSchool = toNonNegNumber(document.getElementById('actSouvSchoolQty').value, 0);
 busy = false;
 processCode(code, { penukar, qtySouvenir, qtySouvenirSchool, isUpdate: true });
}

function onScanSuccess(decoded){
 const code = normalizeQrCode(decoded);
 const now = Date.now();
 if(busy || pendingConfirmRequired || !code) return;
 if(now - lastScanAt < 1200) return;
 processCode(code);
}

function resumeScanner(){
 if(pendingConfirmRequired){
  showResult(
   'bad',
   'Wajib Simpan Konfirmasi Kehadiran',
   '<p>Tekan tombol <b>"Simpan Konfirmasi Kehadiran"</b> terlebih dahulu sebelum scan tamu berikutnya.</p>'
  );
  return;
 }
 busy = false;
 pendingSavePayload = null;
 showResult('', '', '');
 lastScanAt = 0;
 resumeScannerSafe();
}

async function refreshCameras(){
 try{
  if(!navigator.mediaDevices?.getUserMedia) return;
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  stream.getTracks().forEach(t => t.stop());
  cameras = await Html5Qrcode.getCameras();
  const sel = document.getElementById('cameraSelect');
  sel.innerHTML = '';
  cameras.forEach((c, i) => {
   const o = document.createElement('option');
   o.value = c.id;
   o.textContent = c.label || ('Kamera ' + (i + 1));
   sel.appendChild(o);
  });
  const back = cameras.find(c => /back|rear|environment|belakang/i.test(c.label));
  if(back) sel.value = back.id;
 }catch(e){}
}

async function startScanner(){
 if(pendingConfirmRequired){
  showResult(
   'bad',
   'Wajib Simpan Konfirmasi Kehadiran',
   '<p>Tekan tombol <b>"Simpan Konfirmasi Kehadiran"</b> terlebih dahulu sebelum memulai scan baru.</p>'
  );
  return;
 }
 if(!window.Html5Qrcode){
  showResult('bad', 'Library scanner tidak termuat', '<p>Periksa koneksi internet untuk memuat html5-qrcode.</p>');
  return;
 }
 try{
  if(!scanner) scanner = new Html5Qrcode('reader');
  if(typeof scanner.getState === 'function' && scanner.getState() === 2){
   return;
  }
  const id = document.getElementById('cameraSelect').value;
  await scanner.start(
   id || { facingMode: 'environment' },
   { fps: 20, qrbox: { width: 240, height: 240 } },
   onScanSuccess,
   () => {}
  );
  document.getElementById('cameraHint').textContent = 'Kamera aktif. Arahkan QR ke kotak scan.';
 }catch(e){
  showResult('bad', 'Kamera tidak dapat dibuka', '<p>' + esc(e.message || e) + '</p>');
 }
}

async function stopScanner(){
 try{
  if(scanner && typeof scanner.getState === 'function'){
   if(scanner.getState() === 2 || scanner.getState() === 3){
    await scanner.stop();
   }
  } else if(scanner && scanner.isScanning){
   await scanner.stop();
  }
 }catch(e){}
}

function manualSubmit(){
 if(pendingConfirmRequired){
  showResult(
   'bad',
   'Wajib Simpan Konfirmasi Kehadiran',
   '<p>Tekan tombol <b>"Simpan Konfirmasi Kehadiran"</b> terlebih dahulu sebelum memproses kode lain.</p>'
  );
  return;
 }
 const c = document.getElementById('manualCode').value.trim();
 if(!c){
  showResult('bad', 'Kode kosong', '<p>Masukkan ID QR.</p>');
  return;
 }
 processCode(c);
}

function checkApiConnection(){
 const statusEl = document.getElementById('apiStatus');
 if(!isValidApiUrl(API_URL)){
  statusEl.textContent = 'Belum dikonfigurasi (isi API_URL)';
  statusEl.style.color = '#b42318';
  return;
 }
 statusEl.textContent = 'Menghubungkan…';
 statusEl.style.color = '#64748b';

 callAppsScript({}).then(res => {
  if(res && res.ok){
   statusEl.textContent = 'Terhubung (' + (res.status || 'OK') + ')';
   statusEl.style.color = '#16834a';
  } else {
   statusEl.textContent = 'Respons tidak sesuai';
   statusEl.style.color = '#b42318';
  }
 }).catch(err => {
  statusEl.textContent = 'Gagal terhubung: ' + (err && err.message ? err.message : 'Error');
  statusEl.style.color = '#b42318';
 });
}

window.addEventListener('load', () => {
 document.getElementById('mode').value = params.get('mode') === 'souvenir' ? 'souvenir' : 'checkin';
 changeMode();
 bindNumberSanitizers();
 initApiBridge();
 setTimeout(checkApiConnection, 400);
 if(window.isSecureContext && window.Html5Qrcode){
  refreshCameras();
 }
});
</script>
</body>
